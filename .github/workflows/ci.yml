name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Build GitHub Pages export
        env:
          NEXT_PUBLIC_BASE_PATH: /hakarukun-web
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "numpy<2.3"
          "opencv-contrib-python-headless==4.12.0.88"
          "trimesh==4.8.1"
          "scikit-image==0.25.2"

      - name: Run Colab pipeline tests
        run: python -m unittest colab.tests.test_volume_pipeline
